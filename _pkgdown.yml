url: https://sedzinfo.github.io/golemcrypto/

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: katex   # renders the \eqn and \deqn maths of the help pages
  includes:
    # cookie banner and Google Analytics, shared by every site under sedzinfo.github.io (consent.js in that repository)
    after_body: '<script src="/consent.js" defer></script>'

code:
  width: 200

destination: docs

reference:
  - title: App
    contents:
      - crypto
  - title: Data
    contents:
      - get_coins
      - get_history
      - get_listings
  - title: Calculations
    contents:
      - normalize_prices
      - monthly_returns
      - moving_average
      - drawdown
  - title: Charts and tables
    contents:
      - plot_timeseries
      - plot_compare
      - plot_returns_calendar
      - plot_treemap
      - listings_table

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [sedzinfo, github]
  components:
    sedzinfo:
      icon: fas fa-house
      text: home
      href: https://sedzinfo.github.io/
      aria-label: sedzinfo home page
    github:
      icon: fab fa-github
      href: https://github.com/sedzinfo/golemcrypto
      aria-label: GitHub

footer:
  structure:
    left: sedzinfo
    right: sedzinfo_home
  components:
    sedzinfo: '[github.com/sedzinfo](https://github.com/sedzinfo) · [Cookie settings](#cookie-settings)'
    sedzinfo_home: '[home](https://sedzinfo.github.io/)'
